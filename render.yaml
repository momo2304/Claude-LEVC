# Render blueprint: one service per brand, same code. Each keeps its leads
# database on its own persistent disk.
services:
  - type: web
    name: reverie-cab-sales
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk: { name: cab-leads, mountPath: /app/data, sizeGB: 1 }
    envVars:
      - { key: SITE, value: cabs }
      - { key: SITE_URL, sync: false }
      - { key: ADMIN_PASSWORD, generateValue: true }
      - { key: SALES_REPS, value: "2" }
      - { key: SALES_PHONE, sync: false }
      - { key: SALES_PUBLIC_EMAIL, sync: false }
      - { key: FCA_STATEMENT, sync: false }
      - { key: SALES_WEBHOOK_URL, sync: false }
      - { key: RESEND_API_KEY, sync: false }
      - { key: FROM_EMAIL, sync: false }
      - { key: SALES_EMAILS, sync: false }
      - { key: CLOSED_DATES, value: "2026-12-25,2026-12-26,2026-12-28,2027-01-01" }
  - type: web
    name: reverie-executive
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk: { name: exec-leads, mountPath: /app/data, sizeGB: 1 }
    envVars:
      - { key: SITE, value: chauffeur }
      - { key: SITE_URL, sync: false }
      - { key: ADMIN_PASSWORD, generateValue: true }
      - { key: SALES_REPS, value: "2" }
      - { key: SALES_PHONE, sync: false }
      - { key: SALES_PUBLIC_EMAIL, sync: false }
      - { key: FCA_STATEMENT, sync: false }
      - { key: SALES_WEBHOOK_URL, sync: false }
      - { key: RESEND_API_KEY, sync: false }
      - { key: FROM_EMAIL, sync: false }
      - { key: SALES_EMAILS, sync: false }
      - { key: CLOSED_DATES, value: "2026-12-25,2026-12-26,2026-12-28,2027-01-01" }
